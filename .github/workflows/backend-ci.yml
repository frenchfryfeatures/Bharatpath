# Backend CI.
#
# Path-filtered so the frontend work happening in parallel in this same repo
# does not trigger backend runs, and vice versa. Add a sibling frontend-ci.yml
# with its own paths filter rather than extending this one.

name: backend-ci

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: backend

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Invariants 5 and 6 are pure static checks with no dependencies, so they run
  # first and fail fast. They are legal requirements, not style preferences.
  invariants:
    name: invariants 5 and 6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Invariant 5 - no age-gating
        run: python scripts/check_no_age_fields.py
      - name: Invariant 6 - no financial framing
        run: python scripts/check_vocabulary.py

  lint:
    name: lint, types, boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check app tests scripts
      - name: ruff format
        run: ruff format --check app tests scripts
      - name: mypy
        run: mypy app
      - name: module boundaries (import-linter)
        # Enforces invariant 4-prime: add-on modules can never import scoring.
        run: lint-imports
      - name: every module skeleton present
        run: python scripts/gen_modules.py --check

  test:
    name: tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bharatpath
          POSTGRES_PASSWORD: bharatpath
          POSTGRES_DB: bharatpath
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bharatpath"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # The app connects as a role with NO BYPASSRLS that owns nothing, so
      # Row-Level Security genuinely applies to it. Migrations run as a
      # separate owner role. Using one role for both is how an RLS design
      # ends up doing nothing while still looking correct.
      DATABASE_URL: postgresql+asyncpg://bharatpath_app:bharatpath_app@localhost:5432/bharatpath
      DATABASE_URL_APP: postgresql+asyncpg://bharatpath_app:bharatpath_app@localhost:5432/bharatpath
      DATABASE_URL_MIGRATOR: postgresql+asyncpg://bharatpath_migrator:bharatpath_migrator@localhost:5432/bharatpath
      DATABASE_ADMIN_URL: postgresql+asyncpg://bharatpath_admin:bharatpath_admin@localhost:5432/bharatpath
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: local
      CI: "true"
      # Settings refuses to boot with no authentication configured at all.
      # CI has no Cognito pools, so it takes the other branch -- the same one
      # local development uses. Settings itself rejects this flag outside
      # local/CI, so it cannot leak into a deployed environment.
      AUTH_ALLOW_LOCAL_TOKENS: "true"
      # No payment gateway exists. The stub signs callbacks with a real HMAC,
      # so verification is exercised; Settings refuses it outside local/dev.
      PAYMENTS_PROVIDER: stub
      INTERVIEW_QUESTION_PROVIDER: stub
      # One runner IP makes more requests a minute than any person; the global
      # tier is switched on by tests/integration/test_rate_limits.py.
      RATE_LIMIT_GLOBAL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: create extensions and roles
        env:
          PGPASSWORD: bharatpath
        run: |
          psql -h localhost -U bharatpath -d bharatpath \
            -v ON_ERROR_STOP=1 -f scripts/init_db_extensions.sql
          psql -h localhost -U bharatpath -d bharatpath \
            -v ON_ERROR_STOP=1 -f scripts/init_db_roles.sql

      - name: run migrations
        # As the migrator role, which owns the tables. If this ran as the app
        # role, that role would own every table and RLS would silently stop
        # applying to it.
        env:
          DATABASE_URL: postgresql+asyncpg://bharatpath_migrator:bharatpath_migrator@localhost:5432/bharatpath
        run: alembic upgrade head

      - name: verify RLS is actually on
        # Cheap catalog assertion. If the migration ever stops enabling RLS,
        # the integration tests would still pass against an empty database -
        # this fails instead.
        env:
          PGPASSWORD: bharatpath
        run: |
          COUNT=$(psql -h localhost -U bharatpath -d bharatpath -tAc \
            "SELECT count(*) FROM pg_policies WHERE schemaname = 'public'")
          echo "row-level security policies found: $COUNT"
          test "$COUNT" -ge 12

      - name: pytest
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage.xml

  openapi:
    name: publish openapi.json
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: export schema
        # The mobile and three web teams generate their clients from this.
        # Publishing it from Day 2 with stub endpoints is what stops four
        # client teams being blocked on the backend.
        env:
          DATABASE_URL: postgresql+asyncpg://u:p@localhost:5432/db
          REDIS_URL: redis://localhost:6379/0
          # Same reason as the test job: constructing the app constructs
          # Settings, which now requires an authentication mechanism. Nothing
          # here connects to either service -- the URLs are placeholders.
          AUTH_ALLOW_LOCAL_TOKENS: "true"
          # The default question provider is OpenAI, and Settings refuses to
          # construct without its key. The schema does not depend on which
          # provider writes the questions.
          INTERVIEW_QUESTION_PROVIDER: stub
        run: python scripts/export_openapi.py
      - name: export the Postman collection
        # Generated from the schema above, for the same reason it is: a
        # collection maintained by hand drifts within a week, and the drift
        # is invisible -- a stale request 404s and looks like a broken
        # endpoint (Day 20).
        run: python scripts/export_postman.py
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: |
            backend/openapi.json
            backend/bharatpath.postman_collection.json

  image:
    name: build image
    runs-on: ubuntu-latest
    needs: [invariants, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: bharatpath-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
